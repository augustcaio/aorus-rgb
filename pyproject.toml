[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aorus-rgb"
version = "1.0.0"
description = "Controle RGB da Gigabyte B550M Aorus Elite (ITE IT5702) no Linux"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aorus-rgb = "aorus_rgb.__main__:main"

[tool.setuptools]
packages = ["aorus_rgb"]

[tool.ruff]
line-length = 110
cache-dir = "~/.cache/aorus-rgb/ruff"

[tool.pytest.ini_options]
testpaths = ["tests"]
# sem .pytest_cache na pasta do projeto
addopts = "-p no:cacheprovider"

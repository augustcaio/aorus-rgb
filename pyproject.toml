[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aorus-rgb"
version = "2.0.0"
description = "Controle RGB da Gigabyte B550M AORUS ELITE (ITE IT5702) e de memórias ENE no Linux"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aorus-rgb = "aorus_rgb.__main__:main"

[tool.setuptools]
packages = ["aorus_rgb"]

[tool.ruff]
line-length = 110
cache-dir = "~/.cache/aorus-rgb/ruff"

[tool.pytest.ini_options]
testpaths = ["tests"]
# sem .pytest_cache na pasta do projeto
addopts = "-p no:cacheprovider"
# avisos de dentro do PyGObject (asyncio do Python 3.16), não do projeto
filterwarnings = ["ignore::DeprecationWarning:gi.events"]
